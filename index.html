<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Producto Estrella 3D</title>
  <style>
    body {
      margin: 0;
      background-color: #0f1117;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #888;
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      bottom: 20px;
      font-size: 14px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="info">Arrastra un archivo .glb si quieres reemplazarlo</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enableZoom = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    const frontLight = new THREE.DirectionalLight(0xffffff, 2.5);
    frontLight.position.set(2, 4, 5);
    scene.add(frontLight);

    const backLight = new THREE.DirectionalLight(0x3b82f6, 1.5);
    backLight.position.set(-2, -2, -3);
    scene.add(backLight);

    let logoMesh = null;
    const loader = new GLTFLoader();

    function loadGLB(url) {
      loader.load(encodeURI(url), (gltf) => {
        if (logoMesh) scene.remove(logoMesh);
        
        logoMesh = gltf.scene;

        const box = new THREE.Box3().setFromObject(logoMesh);
        const center = box.getCenter(new THREE.Vector3());
        logoMesh.position.sub(center);

        scene.add(logoMesh);
      }, undefined, (error) => {
        console.error("Error al cargar el archivo. Verifica que 'Producto estrella.glb' esté en la misma carpeta.", error);
      });
    }

    loadGLB('Producto estrella.glb');

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith('.glb')) {
        const url = URL.createObjectURL(file);
        loadGLB(url);
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      
      if (logoMesh) {
        logoMesh.rotation.y += 0.003; 
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
